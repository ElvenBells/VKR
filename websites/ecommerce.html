<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic E-Commerce Benchmark v1.0</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #ca8a04;
            --radius: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5; 
            -webkit-font-smoothing: antialiased;
        }

        /* === HEADER === */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1rem 2rem; background: #fff; border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .cart { position: relative; cursor: pointer; padding: 0.5rem; }
        .cart-icon { font-size: 1.5rem; }
        .cart-counter { 
            position: absolute; top: -4px; right: -4px; 
            background: #ef4444; color: #fff; font-size: 0.7rem; font-weight: bold;
            width: 20px; height: 20px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .cart-counter.pulse { transform: scale(1.3); }

        /* === LAYOUT === */
        .container { display: flex; gap: 2rem; padding: 2rem; max-width: 1280px; margin: 0 auto; }
        
        /* === FILTERS === */
        .filters { 
            width: 260px; background: var(--card-bg); padding: 1.5rem; 
            border-radius: var(--radius); border: 1px solid var(--border); height: fit-content;
        }
        .filters h3 { margin-bottom: 1rem; font-size: 1.1rem; }
        .filter-group { margin-bottom: 1.2rem; }
        .filter-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .dropdown { 
            width: 100%; padding: 0.6rem; border: 1px solid var(--border); 
            border-radius: 4px; background: #fff; cursor: pointer;
        }

        /* === PRODUCT GRID === */
        .product-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { 
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: var(--radius); overflow: hidden; 
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.12); }
        .card-img { 
            width: 100%; height: 160px; background: #e2e8f0; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--text-muted); font-size: 0.85rem;
        }
        .card-body { padding: 1rem; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; min-height: 1.4em; }
        .card-price { color: var(--primary); font-weight: 700; font-size: 1.15rem; margin-bottom: 0.6rem; }
        .card-badge { 
            display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; 
            font-size: 0.75rem; font-weight: 500; margin-bottom: 0.8rem;
        }
        .badge-new { background: #dcfce7; color: var(--success); }
        .badge-sale { background: #fef9c3; color: var(--warning); }
        .add-btn { 
            width: 100%; padding: 0.65rem; background: var(--primary); color: #fff; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: 500;
            transition: background 0.2s;
        }
        .add-btn:hover { background: var(--primary-hover); }
        .add-btn:active { transform: scale(0.98); }

        /* === PAGINATION & DYNAMIC ZONES === */
        .pagination-container { text-align: center; padding: 2rem; margin-top: 2rem; border-top: 1px solid var(--border); }
        .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
        .page-btn { padding: 0.5rem 0.9rem; border: 1px solid var(--border); background: #fff; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .page-btn:hover:not(.active) { background: #f1f5f9; }
        
        .dynamic-zone { margin-top: 1rem; color: var(--text-muted); font-size: 0.8rem; }
        .live-counter { display: inline-block; font-variant-numeric: tabular-nums; }

        /* === RESPONSIVE === */
        @media (max-width: 860px) { .container { flex-direction: column; } .filters { width: 100%; } }
    </style>
</head>
<body>

    <!-- HEADER: Cart counter & Logo -->
    <header class="header" id="header">
        <div class="logo" data-testid="logo">ShopBench</div>
        <div class="cart" data-testid="cart-wrapper" title="Корзина">
            <span class="cart-icon">🛒</span>
            <span class="cart-counter" id="cart-counter">0</span>
        </div>
    </header>

    <main class="container">
        <!-- FILTERS: Dropdowns for DOM mutation testing -->
        <aside class="filters" id="filters-panel">
            <h3>Фильтры</h3>
            <div class="filter-group">
                <label for="category-filter">Категория</label>
                <select id="category-filter" class="dropdown" data-testid="category-dropdown">
                    <option value="all">Все товары</option>
                    <option value="electronics">Электроника</option>
                    <option value="clothing">Одежда</option>
                    <option value="home">Для дома</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sort-filter">Сортировка</label>
                <select id="sort-filter" class="dropdown" data-testid="sort-dropdown">
                    <option value="default">По умолчанию</option>
                    <option value="price-asc">Цена: по возрастанию</option>
                    <option value="price-desc">Цена: по убыванию</option>
                </select>
            </div>
        </aside>

        <!-- PRODUCT GRID: Cards for YOLO/OCR detection -->
        <section class="product-grid" id="product-grid" data-testid="grid-container">
            <!-- Rendered via JS -->
        </section>
    </main>

    <!-- PAGINATION & DYNAMIC CONTENT: For SSIM masking testing -->
    <footer class="pagination-container">
        <div class="pagination" id="pagination-controls" data-testid="pagination">
            <button class="page-btn active" data-page="1">1</button>
            <button class="page-btn" data-page="2">2</button>
            <button class="page-btn" data-page="3">3</button>
            <span class="page-btn disabled" disabled>…</span>
            <button class="page-btn" data-page="5">5</button>
        </div>
        <!-- DYNAMIC ZONE: Must be masked during visual regression -->
        <div class="dynamic-zone" id="dynamic-footer">
            Просмотров: <span class="live-counter" id="view-counter">1240</span> | 
            Обновлено: <span id="live-time">--:--:--</span>
        </div>
    </footer>

    <script>
        /**
         * SYNTHETIC E-COMMERCE BENCHMARK
         * Предназначен для контролируемого тестирования CV/OCR/SSIM модулей.
         * Все состояния детерминированы. Хуки для инжекции дефектов помечены комментариями.
         */
        (function() {
            // === MOCK DATA ===
            const CATEGORIES = ['electronics', 'clothing', 'home'];
            const BADGES = ['Новинка', 'Скидка', 'В наличии', 'Хит'];
            const products = Array.from({ length: 32 }, (_, i) => ({
                id: i + 1,
                title: `Устройство ${String.fromCharCode(65 + (i % 26))}-${i + 1}`,
                price: 490 + Math.floor(Math.random() * 4500),
                category: CATEGORIES[i % 3],
                badge: BADGES[i % 4]
            }));

            // === STATE ===
            let cartCount = 0;
            let currentCategory = 'all';
            let currentPage = 1;
            const perPage = 8;

            // === DOM ELEMENTS ===
            const grid = document.getElementById('product-grid');
            const cartCounter = document.getElementById('cart-counter');
            const viewCounter = document.getElementById('view-counter');
            const liveTime = document.getElementById('live-time');
            const catFilter = document.getElementById('category-filter');
            const sortFilter = document.getElementById('sort-filter');

            // === DYNAMIC UPDATES (For SSIM Masking Validation) ===
            setInterval(() => {
                const now = new Date();
                liveTime.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                viewCounter.textContent = parseInt(viewCounter.textContent) + Math.floor(Math.random() * 3);
            }, 1000);

            // === RENDER LOGIC ===
            function render() {
                grid.innerHTML = '';
                let filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
                
                // Sort
                const sort = sortFilter.value;
                if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
                else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);

                const start = (currentPage - 1) * perPage;
                const pageItems = filtered.slice(start, start + perPage);

                pageItems.forEach(p => {
                    const card = document.createElement('article');
                    card.className = 'product-card';
                    card.setAttribute('data-id', p.id);
                    card.setAttribute('data-category', p.category);
                    card.setAttribute('data-testid', 'product-card');
                    
                    const badgeClass = p.badge === 'Новинка' ? 'badge-new' : (p.badge === 'Скидка' ? 'badge-sale' : '');
                    
                    card.innerHTML = `
                        <div class="card-img" data-testid="card-img">Изображение ${p.title}</div>
                        <div class="card-body">
                            <h4 class="card-title" data-testid="card-title">${p.title}</h4>
                            <div class="card-price" data-testid="card-price">${p.price} ₽</div>
                            <span class="card-badge ${badgeClass}" data-testid="card-badge">${p.badge}</span>
                            <button class="add-btn" data-testid="add-btn" data-id="${p.id}">В корзину</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // Bind buttons
                document.querySelectorAll('.add-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        cartCount++;
                        cartCounter.textContent = cartCount;
                        cartCounter.classList.add('pulse');
                        setTimeout(() => cartCounter.classList.remove('pulse'), 200);
                        
                        btn.textContent = '✓ Добавлено';
                        btn.style.background = 'var(--success)';
                        setTimeout(() => {
                            btn.textContent = 'В корзину';
                            btn.style.background = '';
                        }, 1200);
                    });
                });

                // Pagination state
                document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
                const activeBtn = document.querySelector(`.page-btn[data-page="${currentPage}"]`);
                if(activeBtn) activeBtn.classList.add('active');
            }

            // === EVENT LISTENERS ===
            catFilter.addEventListener('change', (e) => { currentCategory = e.target.value; currentPage = 1; render(); });
            sortFilter.addEventListener('change', render);
            document.getElementById('pagination-controls').addEventListener('click', (e) => {
                const btn = e.target.closest('.page-btn');
                if (btn && !btn.disabled) {
                    currentPage = parseInt(btn.dataset.page);
                    render();
                }
            });

            // === INIT ===
            render();

            // === PUBLIC API FOR DEFECT INJECTION (inject-defects.js) ===
            window.benchmark = {
                // Structural mutation
                mutateDOM: () => {
                    const btn = document.querySelector('.add-btn');
                    if(btn) { btn.removeAttribute('class'); btn.setAttribute('data-role', 'submit-action'); }
                },
                // Visual mutation
                mutateCSS: () => {
                    document.documentElement.style.setProperty('--primary', '#ff5722');
                    document.querySelector('.header').style.borderBottom = '2px dashed #ff5722';
                },
                // Semantic mismatch
                mutateText: () => {
                    const title = document.querySelector('.card-title');
                    if(title) title.textContent = '[Текст изменён]';
                },
                // Reset to baseline
                reset: () => location.reload()
            };
        })();
    </script>
</body>
</html>
